<main class="page-main narrow"><div class="page-heading"><span class="eyebrow">NOTES / FRAGMENTS</span><h1>Log</h1></div>
<section class="log-composer" aria-labelledby="composer-title">
  <div class="composer-top"><span class="eyebrow" id="composer-title">QUICK POST</span><span id="log-char-count" class="composer-count">0</span></div>
  <label class="sr-only" for="log-draft">Write a short note</label>
  <textarea id="log-draft" rows="4" maxlength="1000" placeholder="いま考えていること、制作メモ、見つけたもの。
短くても、そのまま残す。"></textarea>
  <div class="composer-optional"><label for="log-image-url">Image URL <span>(optional)</span></label><input id="log-image-url" type="url" placeholder="https://… / Dropbox shared link"></div>
  <div class="composer-actions"><button id="log-save-draft" type="button" class="composer-secondary">Save draft</button><button id="log-generate" type="button" class="composer-submit">Generate post files ↗</button></div>
  <p id="log-compose-status" class="composer-status" aria-live="polite">Draft is saved on this device only. To publish it to the site, add the generated files to the repository.</p>
  <div id="log-compose-output" class="composer-output" hidden><label for="log-index-line">Add this line to <code>data/log/index.json</code></label><textarea id="log-index-line" rows="3" readonly></textarea><button id="log-copy-index" type="button" class="composer-secondary">Copy index entry</button></div>
</section>
<div id="log-root"><p class="loading">Loading log…</p></div></main>
